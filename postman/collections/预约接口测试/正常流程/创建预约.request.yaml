$kind: http-request
url: "{{base_url}}/booking"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{\r

    \  \"firstname\": \"Alex\",\r

    \  \"lastname\": \"Learner\",\r

    \  \"totalprice\": 200,\r

    \  \"depositpaid\": true,\r

    \  \"bookingdates\": {\r

    \    \"checkin\": \"2026-11-01\",\r

    \    \"checkout\": \"2026-11-03\"\r

    \  },\r

    \  \"additionalneeds\": \"Breakfast\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"创建成功并保存预约编号\", function () {\r

      \    pm.response.to.have.status(200);\r

      \r

      \    const data = pm.response.json();\r

      \r

      \    pm.expect(data.bookingid).to.be.a(\"number\");\r

      \    pm.expect(Number.isInteger(data.bookingid)).to.eql(true);\r

      \    pm.expect(data.bookingid).to.be.above(0);\r

      \r

      \    pm.expect(data.booking.firstname).to.eql(\"Alex\");\r

      \    pm.expect(data.booking.totalprice).to.eql(200);\r

      \    pm.expect(data.booking.depositpaid).to.eql(true);\r

      \r

      \    pm.environment.set(\"booking_id\", data.bookingid);\r

      });"
    language: text/javascript
order: 2000
