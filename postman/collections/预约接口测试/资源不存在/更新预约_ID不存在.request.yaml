$kind: http-request
url: "{{base_url}}/booking/{{booking_id}}"
method: PUT
headers:
  Content-Type: application/json
  Cookie: token={{token}}
body:
  type: json
  content: "{\r

    \  \"firstname\": \"Alex\",\r

    \  \"lastname\": \"Learner\",\r

    \  \"totalprice\": 300,\r

    \  \"depositpaid\": true,\r

    \  \"bookingdates\": {\r

    \    \"checkin\": \"2026-11-01\",\r

    \    \"checkout\": \"2026-11-03\"\r

    \  },\r

    \  \"additionalneeds\": \"Breakfast\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"不存在的预约更新返回404\", function () {\r

      \    pm.response.to.have.status(404);\r

      \r

      \    const data = pm.response.json();\r

      \    pm.expect(data.error).to.eql(\"Booking not found\");\r

      });"
    language: text/javascript
order: 2800500992803419
