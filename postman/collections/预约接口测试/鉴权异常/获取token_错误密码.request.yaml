$kind: http-request
url: "{{base_url}}/auth"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{\r

    \  \"username\": \"{{username}}\",\r

    \  \"password\": \"wrong_password\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"错误密码被拒绝\", function () {\r

      \    pm.response.to.have.status(401);\r

      \r

      \    const data = pm.response.json();\r

      \    pm.expect(data.error).to.eql(\"Bad credentials\");\r

      \    pm.expect(data).to.not.have.property(\"token\");\r

      });"
    language: text/javascript
order: 4000
